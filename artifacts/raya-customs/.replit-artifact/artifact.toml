kind = "web"
previewPath = "/"
title = "RAYA Customs"
description = "RAYA Jordan customs brokerage platform: tariff lookup, shipment tracking, OCR-assisted declarations, GST calculations, a client portal, and staff operations tools. Imported from the user's GitHub repository for a full product improvement pass."
version = "1.0.0"
id = "artifacts/raya-customs"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18608

[services.development]
run = "pnpm --filter @workspace/raya-customs run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/raya-customs", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"
PORT = "18608"

[services.production.run]
args = [ "node", "artifacts/raya-customs/prod.mjs" ]

[services.production.run.env]
PORT = "18608"
NODE_ENV = "production"

[services.production.health.startup]
path = "/rapi/health"

[services.env]
PORT = "18608"
BASE_PATH = "/"
